server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # photos, QR codes and labels are uploaded through here
    client_max_body_size 20m;

    # smaller downloads
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # look the backend up again each time, so it keeps working after the backend is rebuilt
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:5000;

    # API
    location /api/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # uploaded files (logo, QR codes, labels, payment proofs)
    location /static/ {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    # sitemap for Google, built by the backend
    location = /sitemap.xml {
        proxy_pass http://$backend/api/sitemap.xml;
        proxy_set_header Host $host;
    }

    # built JS and CSS have a fingerprint in the name, so browsers can keep them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # every other address is a page of the app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
