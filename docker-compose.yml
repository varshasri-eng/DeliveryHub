services:

  postgres:
    image: postgres:16-alpine
    container_name: delivery_hub_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # only reachable from this server, not from the internet
    ports:
      - "127.0.0.1:5440:5432"

    volumes:
      - delivery_hub_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build: ./backend
    container_name: delivery_hub_backend
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      FLASK_ENV: ${FLASK_ENV}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      FLASK_APP: wsgi.py
      FRONTEND_URL: ${FRONTEND_URL}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

    # only reachable from this server; the website reaches it through the frontend container
    ports:
      - "127.0.0.1:5010:5000"

    # keeps uploaded files (logo, QR codes, labels) on the server's disk
    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy

    # (the start command, gunicorn, is now in backend/Dockerfile)


  frontend:
    build: ./frontend
    container_name: delivery_hub_frontend
    restart: unless-stopped

    # the built site is served by nginx on port 80 inside the container
    ports:
      - "4010:80"

    depends_on:
      - backend


volumes:
  delivery_hub_pgdata: