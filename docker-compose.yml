services:

  postgres:
    image: postgres:16-alpine
    container_name: meat_delivery_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5435:5432"

    volumes:
      - meat_delivery_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build: ./backend
    container_name: meat_delivery_backend
    restart: unless-stopped

    environment:
      DATABASE_URL: ${DATABASE_URL}
      FLASK_ENV: ${FLASK_ENV}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
      FLASK_APP: wsgi.py
      FRONTEND_URL: ${FRONTEND_URL}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

    ports:
      - "5003:5000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy

    command: python wsgi.py


  frontend:
    build: ./frontend
    container_name: meat_delivery_frontend
    restart: unless-stopped

    environment:
      VITE_API_URL: ""

    ports:
      - "4002:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend


volumes:
  meat_delivery_pgdata:
